<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ka Noa — Trama do tempo</title>

  <!-- Resource map: JSX-referenced assets the bundler can't auto-discover -->
  <meta name="ext-resource-dependency" content="../../assets/ka-noa-logo.svg"           data-resource-id="knLogo" />
  <meta name="ext-resource-dependency" content="../../assets/brand/run-beach.jpg"        data-resource-id="imgRunBeach" />
  <meta name="ext-resource-dependency" content="../../assets/brand/row-your-flow-back.jpg" data-resource-id="imgRowBack" />
  <meta name="ext-resource-dependency" content="../../assets/brand/rashguard-white.jpg"  data-resource-id="imgRashguardWhite" />
  <meta name="ext-resource-dependency" content="../../assets/brand/sleeve-orange.jpg"    data-resource-id="imgSleeveOrange" />
  <meta name="ext-resource-dependency" content="../../assets/brand/cap-ocean.jpg"        data-resource-id="imgCapOcean" />
  <meta name="ext-resource-dependency" content="../../assets/brand/tights.jpg"           data-resource-id="imgTights" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="sections.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Splash / no-JS fallback shown while the bundle unpacks -->
  <template id="__bundler_thumbnail" data-bg-color="#0E0E0E">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#0E0E0E"/>
      <!-- Brand wordmark mock -->
      <g fill="#F4EFE6" font-family="system-ui, sans-serif" font-weight="600">
        <text x="600" y="370" font-size="120" text-anchor="middle" letter-spacing="-2">row your</text>
        <text x="600" y="490" font-size="120" text-anchor="middle" fill="#C85A18" letter-spacing="-2">flow.</text>
      </g>
      <!-- Simplified polynesian doodle, top-right -->
      <g transform="translate(960 160) scale(3)" fill="#C85A18">
        <polygon points="0,0 28,0 28,6 6,6 6,28 0,28"/>
        <polygon points="40,0 68,0 68,28 62,28 62,6 40,6"/>
        <polygon points="0,40 6,40 6,62 28,62 28,68 0,68"/>
        <polygon points="62,40 68,40 68,68 40,68 40,62 62,62"/>
        <rect x="28" y="28" width="12" height="12"/>
      </g>
      <!-- Tracked tagline -->
      <text x="600" y="620" font-size="22" fill="#8A8A8A" font-family="system-ui, sans-serif"
            text-anchor="middle" letter-spacing="6">VA'A · CANOA HAVAIANA · VESTUÁRIO TÉCNICO</text>
    </svg>
  </template>

  <div id="root"></div>

  <script type="text/babel" src="Buttons.jsx"></script>
  <script src="doodles-data.js"></script>
  <script type="text/babel" src="Doodle.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Marquee.jsx"></script>
  <script type="text/babel" src="Manifesto.jsx"></script>
  <script type="text/babel" src="Canoas.jsx"></script>
  <script type="text/babel" src="Vestuario.jsx"></script>
  <script type="text/babel" src="Agenda.jsx"></script>
  <script type="text/babel" src="Lojistas.jsx"></script>
  <script type="text/babel" src="Depoimentos.jsx"></script>
  <script type="text/babel" src="Newsletter.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [scrolled, setScrolled] = React.useState(false);
      const [menuOpen, setMenuOpen] = React.useState(false);

      React.useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener("scroll", onScroll);
        onScroll();
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      React.useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      return (
        <React.Fragment>
          <Header scrolled={scrolled} onMenu={() => setMenuOpen(o => !o)} />
          <main>
            <Hero />
            <Marquee />
            <Manifesto />
            <Canoas />
            <Vestuario />
            <Depoimentos />
            <Agenda />
            <Lojistas />
            <Newsletter />
          </main>
          <Footer />
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
